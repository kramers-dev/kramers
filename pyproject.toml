[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kramers"
dynamic = ["version"]
description = "An open handbook of first-passage and escape results in statistical physics: every formula a function, tied to its paper, checked against an independent solver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Sokol" }]
keywords = [
  "first passage", "escape rate", "Kramers", "Fokker-Planck", "stochastic processes",
  "statistical physics", "stochastic resetting", "saddle-node", "rare events",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
reference = ["mpmath>=1.3"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "matplotlib>=3.7", "mpmath>=1.3"]

[project.urls]
Repository = "https://github.com/kramers-dev/kramers"
Issues = "https://github.com/kramers-dev/kramers/issues"

[tool.setuptools.dynamic]
version = { attr = "kramers._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kramers = ["data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "NPY", "B"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: checks that take more than a few seconds (run nightly)"]
addopts = "-m 'not slow'"
